# Dogfood: this repository tracks its own traffic with the action from this checkout.
# The resulting `openstars` branch is the live demo linked from README.md.
name: OpenStars

on:
  schedule:
    - cron: "17 3 * * *" # daily; off the full hour, GitHub throttles :00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          token: ${{ secrets.OPENSTARS_TOKEN }}
          releases: "true"
          repos: |
            Resetnak/OpenStars
            Resetnak/herdr-logbook
            Resetnak/cooldeck
            Resetnak/MakeView
            Resetnak/domain-availability-skill
            Resetnak/homebrew-tap
