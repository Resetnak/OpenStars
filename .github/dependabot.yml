version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript majors and @types/node beyond the runner's Node are reviewed by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
